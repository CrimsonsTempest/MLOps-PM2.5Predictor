global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: 'pm25-predictor'
    environment: 'development'

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'model-serving'
    dns_sd_configs:
      - names:
          - 'model-serving'
        type: 'A'
        port: 8080
    metrics_path: '/metrics'
    scrape_interval: 10s

  - job_name: 'nginx-exporter'
    static_configs:
      - targets: ['nginx-exporter:9113']
    metrics_path: '/metrics'
    scrape_interval: 15s