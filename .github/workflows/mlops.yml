name: PM2.5 MLOps CI/CD

on:
  push:
    branches: [main]
    # Only run CI when code or config changes; ignore documentation-only edits.
    paths-ignore:
      - 'README.md'
      - '*.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - '*.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'

permissions:
  contents: read

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14.10"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

  train-evaluate-register:
    name: Train, evaluate, and register
    runs-on: ubuntu-latest
    needs: tests
    timeout-minutes: 20
    env:
      MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
      MLFLOW_MODEL_NAME: ${{ vars.MLFLOW_MODEL_NAME || 'xgboost_24compact' }}
      # S3-compatible storage (Cloudflare R2, MinIO, AWS S3, etc.)
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_ENDPOINT_URL: ${{ secrets.AWS_ENDPOINT_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14.10"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate required settings and secrets
        shell: bash
        run: |
          test -n "$MLFLOW_TRACKING_URI" || {
            echo "Repository secret MLFLOW_TRACKING_URI is not configured."
            exit 1
          }
          test -n "$AWS_ACCESS_KEY_ID" || {
            echo "Repository secret AWS_ACCESS_KEY_ID is not configured."
            exit 1
          }
          test -n "$AWS_SECRET_ACCESS_KEY" || {
            echo "Repository secret AWS_SECRET_ACCESS_KEY is not configured."
            exit 1
          }
          test -n "$AWS_DEFAULT_REGION" || {
            echo "Repository secret AWS_DEFAULT_REGION is not configured."
            exit 1
          }

      - name: Pull DVC data
        run: dvc pull

      - name: Train model
        shell: bash
        run: |
          # Enforce the LK-01 maximum retraining duration of 10 minutes.
          # Values mirrored from config/ci_config.yaml (training.timeout_minutes,
          # evaluation.train_frac, evaluation.val_frac).
          timeout 10m python src/train/train.py \
            --tracking-uri "$MLFLOW_TRACKING_URI" \
            --train-frac 0.70 \
            --val-frac 0.15

      - name: Evaluate against persistence baseline
        run: |
          # Values mirrored from config/ci_config.yaml (evaluation.min_skill).
          python src/evaluation/evaluate_model.py \
            --input data/processed/processed_data.csv \
            --meta data/processed/processed_data_meta.json \
            --model models/model.joblib \
            --output models/evaluation_report.json \
            --min-skill 0.20

      - name: Register model and move version to Staging
        run: |
          python src/registry/register_model.py \
            --tracking-uri "$MLFLOW_TRACKING_URI" \
            --model-name "$MLFLOW_MODEL_NAME" \
            --model-meta models/model_meta.json \
            --evaluation-report models/evaluation_report.json

      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pm25-evaluation-report
          path: models/evaluation_report.json
          if-no-files-found: ignore
          retention-days: 14
