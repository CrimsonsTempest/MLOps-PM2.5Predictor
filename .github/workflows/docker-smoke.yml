name: Docker Smoke Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  docker-smoke:
    name: Docker smoke test (build + up + health check)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create .env from GitHub secret (or dummy fallback for CI)
        run: |
          if [ -n "${{ secrets.API_KEY }}" ]; then
            echo "API_KEY=${{ secrets.API_KEY }}" > .env
            echo "Using API key from GitHub secret"
          else
            echo "API_KEY=dummy-smoke-test-key" > .env
            echo "WARNING: secrets.API_KEY not set; using dummy key. Ingest will fail but API stays up."
          fi

      - name: Build docker compose services (no push)
        run: |
          docker compose build

      - name: Start services in background
        run: |
          docker compose up -d

      - name: Wait for mlflow-server to become healthy
        run: |
          for i in $(seq 1 30); do
            status=$(docker inspect --format='{{.State.Health.Status}}' pm25-mlflow-server 2>/dev/null || echo "starting")
            if [ "$status" = "healthy" ]; then
              echo "mlflow-server is healthy"
              exit 0
            fi
            echo "Waiting for mlflow-server... ($i/30) status=$status"
            sleep 5
          done
          echo "mlflow-server did not become healthy in time"
          docker compose logs pm25-mlflow-server --tail 50
          exit 1

      - name: Verify api-service is running
        run: |
          status=$(docker inspect --format='{{.State.Status}}' pm25-api-service 2>/dev/null || echo "unknown")
          echo "api-service status: $status"
          test "$status" = "running"

      - name: Smoke test /health endpoint
        run: |
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/health || echo "000")
            if [ "$code" = "200" ]; then
              echo "/health returned 200 OK"
              curl -s http://localhost:8000/health
              echo
              exit 0
            fi
            echo "Waiting for /health... ($i/10) code=$code"
            sleep 3
          done
          echo "/health did not return 200"
          docker compose logs pm25-api-service --tail 50
          exit 1

      - name: Teardown services
        if: always()
        run: |
          docker compose down -v