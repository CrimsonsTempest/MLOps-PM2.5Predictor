services:
  model-serving:
    build:
      context: .
      dockerfile: mlflow/Dockerfile.serving
    image: pm25-model-serving:latest
    deploy:
      replicas: 3
    expose:
      - "8080"
    command: ["mlflow", "models", "serve", "--model-uri", "/opt/ml/model", "--host", "0.0.0.0", "--port", "8080", "--env-manager", "local"]
    networks:
      - pm25-net

  serving-proxy:
    image: nginx:alpine
    ports:
      - "8080:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - pm25-net
    depends_on:
      - model-serving

networks:
  pm25-net:
    driver: bridge